[package]
name = "rust-photos"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Rust Photos: a fast native photo viewer and editor (pure Rust, no WebView2)"
build = "build.rs"

[dependencies]
rust-photos-core = { path = "../core" }
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "unstable-winit-030"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
window-vibrancy = "0.6"
raw-window-handle = "0.6"
single-instance = "0.3"
rand = "0.8"
image = { version = "0.25", default-features = false }

[package.metadata.packager]
productName = "Rust Photos"
identifier = "com.minhtrong67.rustphotos"
publisher = "minhtrong67"
copyright = "Copyright (c) 2026 minhtrong67"
longDescription = "A fast native photo viewer and editor for Windows, written in Rust with a Fluent (WinUI 3) look. No WebView2, no JavaScript."
licenseFile = "../../LICENSE"
icons = ["assets/icon.ico"]
formats = ["nsis"]
# cargo-packager does not compile your app by itself
beforePackagingCommand = "cargo build --release -p rust-photos"

[package.metadata.packager.nsis]
installMode = "currentUser"
installerIcon = "assets/icon.ico"
compression = "lzma"
languages = ["English"]
# offered (unchecked) in the uninstaller as "delete app data"
appdataPaths = ["$APPDATA/RustPhotos", "$LOCALAPPDATA/RustPhotos"]

[build-dependencies]
slint-build = "1.19"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
