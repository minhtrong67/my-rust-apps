[package]
name = "rust-photos-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Pure Rust engine of Rust Photos: library, EXIF, thumbnails, editing, settings"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico", "rayon"] }
kamadak-exif = "0.6"
rayon = "1"
trash = "5"
dirs = "5"
fast_image_resize = { version = "5", features = ["image"] }
resvg = { version = "0.45", default-features = false }
tiny-skia = "0.11"
ab_glyph = "0.2"
fontdb = "0.23"
sys-locale = "0.3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
